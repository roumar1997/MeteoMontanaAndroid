# Crear quedada en 3 pasos (ESCRIBE en staging): crea «PRUEBA MAESTRO» en Zarzalejo, comprueba que se abre y la ELIMINA.
appId: com.meteomontana.android
---
- launchApp:
    clearState: false
- tapOn: "Quedadas"
- extendedWaitUntil:
    visible: "Crear quedada"
    timeout: 15000
- runFlow:
    when:
      visible: "Entendido"
    commands:
      - tapOn: "Entendido"
- tapOn: "Crear quedada"
- extendedWaitUntil:
    visible: "Nueva quedada"
    timeout: 10000
# Paso 1: lugar (escuela) y día
# el texto de ayuda del buscador no sale en el árbol de accesibilidad: se toca por posición
- tapOn:
    point: "50%,34%"
- inputText: "Zarzalejo"
- hideKeyboard
# índice 1: el 0 es el texto escrito en el buscador
- tapOn:
    text: "Zarzalejo"
    index: 1
- scrollUntilVisible:
    element: "¿CUÁNDO?"
- tapOn: "SÁB"
- tapOn: "SIGUIENTE.*"
# Paso 2: sin cambios (todo opcional)
- extendedWaitUntil:
    visible: "¿CUÁNTOS BUSCÁIS?"
    timeout: 8000
- tapOn: "SIGUIENTE.*"
# Paso 3: nombre y crear
- extendedWaitUntil:
    visible: "NOMBRE \\(OPCIONAL\\)"
    timeout: 8000
- tapOn: "Quedada en Zarzalejo"
- inputText: "PRUEBA MAESTRO"
- hideKeyboard
- tapOn: "CREAR QUEDADA"
# Al crearla se abre su detalle (tarda unos segundos)
- extendedWaitUntil:
    visible: "ELIMINAR QUEDADA"
    timeout: 60000
- assertVisible: "PRUEBA MAESTRO"
# Limpieza: eliminarla
- tapOn: "ELIMINAR QUEDADA"
- extendedWaitUntil:
    visible: "Se eliminará la quedada y su chat de grupo. ¿Continuar?"
    timeout: 8000
- tapOn: "Eliminar"
- extendedWaitUntil:
    visible: "QUEDADAS"
    timeout: 20000
- assertNotVisible: "PRUEBA MAESTRO"
