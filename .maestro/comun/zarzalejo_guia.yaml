# Reutilizable: abre la ficha de Zarzalejo (escuela con vías en staging) en la pestaña GUÍA.
appId: com.meteomontana.android
---
- runFlow: escuelas_lista.yaml
# La lista cambia de orden con el tiempo: se llega con el buscador, no por posición.
# (el hint del buscador no sale en la jerarquía: se toca por posición)
- tapOn:
    point: "50%,20%"
- inputText: "Zarzalejo"
- hideKeyboard
- extendedWaitUntil:
    visible: "ESCUELAS"
    timeout: 30000
- extendedWaitUntil:
    visible: "▸"
    timeout: 30000
# índice 1: el 0 es el texto escrito en el buscador
- tapOn:
    text: "Zarzalejo"
    index: 1
- extendedWaitUntil:
    visible: "TIEMPO"
    timeout: 25000
- runFlow:
    when:
      visible: "Entendido"
    commands:
      - tapOn: "Entendido"
- tapOn: "GUÍA"
- extendedWaitUntil:
    visible: ".*VÍAS · .*"
    timeout: 20000
