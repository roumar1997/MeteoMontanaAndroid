# Perfil: tarjeta de degradado -> Estadisticas (Todo / Roca / Rocodromo) -> volver; abre la lista BLOQUES del diario y busca.
appId: com.meteomontana.android
---
- launchApp:
    clearState: false
- tapOn: "Perfil"
- extendedWaitUntil:
    visible: "VER TODO.*"
    timeout: 15000
- tapOn: "VER TODO.*"
- extendedWaitUntil:
    visible: "Estadísticas"
    timeout: 15000
- tapOn: "ROCÓDROMO"
- waitForAnimationToEnd
- tapOn: "ROCA"
- waitForAnimationToEnd
- tapOn:
    text: "Volver"
- extendedWaitUntil:
    visible: "BLOQUES"
    timeout: 10000
- tapOn:
    text: "BLOQUES"
    index: 0
- extendedWaitUntil:
    visible: "Mis bloques"
    timeout: 15000
- tapOn: "Buscar por nombre, escuela o sector"
- inputText: "Zarzalejo"
- waitForAnimationToEnd
- assertVisible: ".*Zarzalejo.*"
- hideKeyboard
- tapOn: "Volver"
- extendedWaitUntil:
    visible: "BLOQUES"
    timeout: 10000
