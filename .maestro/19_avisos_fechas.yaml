# Notificaciones: las fechas salen relativas («hace 2 días», «Ayer», «10 ago»), nunca en ISO («2026-08-10»).
appId: com.meteomontana.android
---
- launchApp:
    clearState: false
    stopApp: true
- tapOn: "Escuelas"
- extendedWaitUntil:
    visible: "VER MAPA"
    timeout: 20000
- tapOn: "Notificaciones"
- extendedWaitUntil:
    visible: "Cerrar"
    timeout: 20000
- assertNotVisible: ".*20[0-9][0-9]-[0-9][0-9]-[0-9][0-9].*"
- assertVisible: ".*(hace .*|Ayer|[0-9]{1,2} [a-z]{3,5}[.]?)"
- takeScreenshot: 19_fechas
- tapOn: "Cerrar"
- extendedWaitUntil:
    visible: "VER MAPA"
    timeout: 10000
